name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        env:
          SF_DOMAIN: "https://test-org.my.salesforce.com"
          SF_CLIENT_ID: "dummy-client-id"
          SF_CLIENT_SECRET: "dummy-client-secret"
          GEMINI_API_KEY: "dummy-gemini-key"
        run: pytest -v
